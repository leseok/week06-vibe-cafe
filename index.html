<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 주문서</title>
  <!-- 스타일 파일 연결 -->
  <link rel="stylesheet" href="style.css">
  <!-- Supabase v2를 먼저 읽고, 그다음 script.js를 실행 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <!-- 기능 파일 연결 -->
  <script src="script.js" defer></script>
</head>
<body>
  <!-- 카페 로고, 이름, 부제 -->
  <header>
    <h1><span class="cafe-logo" aria-hidden="true">☕</span><br>바이브 카페</h1>
    <p>당신의 하루에 바이브를 더하다</p>
    <!-- 탭 버튼과 패널을 aria-controls / aria-labelledby로 연결 -->
    <nav class="tab-menu" role="tablist" aria-label="카페 메뉴">
      <button type="button" id="order-tab" class="tab-button active" role="tab" aria-selected="true" aria-controls="order-form">☕ 주문하기</button>
      <button type="button" id="history-tab" class="tab-button" role="tab" aria-selected="false" aria-controls="orders-panel" tabindex="-1">📋 주문 내역 <span id="order-count" class="order-count" aria-live="polite">0</span></button>
    </nav>
  </header>

  <main>
    <!-- 이름 필수 검사는 JavaScript에서 처리 -->
    <form id="order-form" role="tabpanel" aria-labelledby="order-tab" tabindex="0" novalidate>
      <!-- 고객 정보 -->
      <div>
        <label for="customer-name">이름 (필수)</label>
        <input type="text" id="customer-name" name="customerName" autocomplete="name" required>
      </div>
      <div>
        <label for="customer-phone">전화번호</label>
        <input type="tel" id="customer-phone" name="customerPhone" autocomplete="tel">
      </div>

      <!-- 음료 가격은 숫자 형태의 data-price 속성으로 저장 -->
      <div>
        <label for="drink">음료 선택</label>
        <select id="drink" name="drink">
          <option value="" data-price="0" selected>-- 음료를 선택하세요 --</option>
          <option value="americano" data-price="3500">아메리카노 3,500원</option>
          <option value="cafe-latte" data-price="4000">카페라떼 4,000원</option>
          <option value="cafe-mocha" data-price="4500">카페모카 4,500원</option>
          <option value="vanilla-latte" data-price="4500">바닐라라떼 4,500원</option>
          <option value="green-tea-latte" data-price="4500">녹차라떼 4,500원</option>
        </select>
      </div>

      <!-- 사이즈와 추가 금액 -->
      <fieldset>
        <legend>사이즈</legend>
        <input type="radio" id="size-s" name="size" value="S" data-price="0">
        <label for="size-s">S +0원</label>
        <input type="radio" id="size-m" name="size" value="M" data-price="500" checked>
        <label for="size-m">M +500원</label>
        <input type="radio" id="size-l" name="size" value="L" data-price="1000">
        <label for="size-l">L +1,000원</label>
      </fieldset>

      <!-- 추가 옵션과 추가 금액 -->
      <fieldset>
        <legend>추가 옵션</legend>
        <input type="checkbox" id="option-shot" name="options" value="shot" data-price="500">
        <label for="option-shot">샷 추가 +500원</label>
        <input type="checkbox" id="option-cream" name="options" value="cream" data-price="500">
        <label for="option-cream">크림 추가 +500원</label>
        <input type="checkbox" id="option-syrup" name="options" value="syrup" data-price="300">
        <label for="option-syrup">시럽 추가 +300원</label>
        <input type="checkbox" id="option-decaf" name="options" value="decaf" data-price="0">
        <label for="option-decaf">디카페인 +0원</label>
      </fieldset>

      <!-- 수량과 요청사항 -->
      <div>
        <label for="quantity">수량</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
      </div>
      <div>
        <label for="requests">요청사항</label>
        <textarea id="requests" name="requests" rows="4"></textarea>
      </div>

      <!-- 예상 금액은 주문하기 버튼 바로 위에 표시 -->
      <p id="estimated-price" aria-live="polite">예상 금액: <span id="total-price">0</span>원</p>
      <button type="submit" id="submit-order">주문하기</button>
      <button type="reset" id="reset-order">다시 작성</button>

      <!-- 주문 확인 메시지 영역은 처음에는 숨김 -->
      <div id="order-confirmation" class="hidden" role="status" aria-live="polite"></div>
    </form>

    <!-- 주문 목록은 JavaScript의 renderOrders()에서 생성 -->
    <section id="orders-panel" class="hidden" role="tabpanel" aria-labelledby="history-tab" tabindex="0">
      <p id="orders-empty">아직 주문 내역이 없어요 ☕</p>
      <div id="orders-list" class="orders-list"></div>
      <div class="orders-footer">
        <p id="orders-total" aria-live="polite">총 주문 금액: 0원 (0건)</p>
        <button type="button" id="clear-orders" disabled>내역 모두 지우기</button>
      </div>
    </section>
  </main>
</body>
</html>
